[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-partner"
version = "0.0.1"
description = "A self-hosted web interface for managing persistent Codex tasks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "tomli>=2.0; python_version < '3.11'",
  "PyYAML>=6.0",
  "pexpect>=4.8; platform_system != 'Windows'",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
]

[project.scripts]
codex-partner = "codex_partner.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["codex_partner*", "static*"]

[tool.setuptools.package-data]
static = ["**/*"]
