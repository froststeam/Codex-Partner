[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-partner"
version = "0.0.6"
description = "A self-hosted web interface for managing persistent Codex tasks."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["codex", "agent", "task-management", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "tomli>=2.0; python_version < '3.11'",
  "PyYAML>=6.0",
  "pexpect>=4.8; platform_system != 'Windows'",
  "pywinpty>=2.0.13; platform_system == 'Windows'",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/froststeam/Codex-Partner"
Repository = "https://github.com/froststeam/Codex-Partner.git"
Issues = "https://github.com/froststeam/Codex-Partner/issues"

[project.scripts]
codex-partner = "codex_partner.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["codex_partner*", "static*"]

[tool.setuptools.package-data]
static = ["**/*"]
